<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .result-card {
            display: none;
            margin-top: 20px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Heart Disease Risk Prediction</h1>
        <form id="predictionForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" id="age" name="age" required min="0" max="120">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="sex" class="form-label">Sex</label>
                    <select class="form-select" id="sex" name="sex" required>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="chest_pain" class="form-label">Chest Pain Type</label>
                    <select class="form-select" id="chest_pain" name="chest_pain" required>
                        <option value="TA">Typical Angina</option>
                        <option value="ATA">Atypical Angina</option>
                        <option value="NAP">Non-Anginal Pain</option>
                        <option value="ASY">Asymptomatic</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="resting_bp" class="form-label">Resting Blood Pressure (mm Hg)</label>
                    <input type="number" class="form-control" id="resting_bp" name="resting_bp" required min="0" max="300">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="cholesterol" class="form-label">Cholesterol (mg/dl)</label>
                    <input type="number" class="form-control" id="cholesterol" name="cholesterol" required min="0" max="1000">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="fasting_bs" class="form-label">Fasting Blood Sugar > 120 mg/dl</label>
                    <select class="form-select" id="fasting_bs" name="fasting_bs" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="resting_ecg" class="form-label">Resting ECG Results</label>
                    <select class="form-select" id="resting_ecg" name="resting_ecg" required>
                        <option value="Normal">Normal</option>
                        <option value="ST">ST-T Wave Abnormality</option>
                        <option value="LVH">Left Ventricular Hypertrophy</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="max_hr" class="form-label">Maximum Heart Rate</label>
                    <input type="number" class="form-control" id="max_hr" name="max_hr" required min="0" max="250">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="exercise_angina" class="form-label">Exercise-Induced Angina</label>
                    <select class="form-select" id="exercise_angina" name="exercise_angina" required>
                        <option value="N">No</option>
                        <option value="Y">Yes</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="oldpeak" class="form-label">ST Depression (mm)</label>
                    <input type="number" class="form-control" id="oldpeak" name="oldpeak" required step="0.1" min="-10" max="10">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="st_slope" class="form-label">ST Slope</label>
                    <select class="form-select" id="st_slope" name="st_slope" required>
                        <option value="Up">Upsloping</option>
                        <option value="Flat">Flat</option>
                        <option value="Down">Downsloping</option>
                    </select>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Make Prediction</button>
            </div>
        </form>

        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Making prediction...</p>
        </div>

        <div class="result-card">
            <h3 class="text-center mb-4">Prediction Results</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Random Forest Prediction</h5>
                            <p class="card-text" id="rf_result">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Decision Tree Prediction</h5>
                            <p class="card-text" id="dt_result">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Logistic Regression Prediction</h5>
                            <p class="card-text" id="lr_result">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Average Prediction</h5>
                            <p class="card-text" id="avg_result">-</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#predictionForm').on('submit', function(e) {
                e.preventDefault();
                
                $('.loading').show();
                $('.result-card').hide();
                
                $.ajax({
                    url: '/predict',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        $('#rf_result').text(response.rf_prediction);
                        $('#dt_result').text(response.dt_prediction);
                        $('#lr_result').text(response.lr_prediction);
                        $('#avg_result').text(response.average_prediction);
                        
                        $('.loading').hide();
                        $('.result-card').show();
                    },
                    error: function(xhr) {
                        alert('An error occurred: ' + xhr.responseJSON.error);
                        $('.loading').hide();
                    }
                });
            });
        });
    </script>
</body>
</html>
